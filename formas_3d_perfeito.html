<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Formas Geométricas — Planificação Perfeita</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0a0e17;color:#fff;height:100vh;overflow:hidden}
#app{display:flex;height:100vh}
#sidebar{width:270px;background:#111827;border-right:1px solid #1f2937;padding:14px;overflow-y:auto}
#sidebar h2{color:#60a5fa;font-size:17px;text-align:center;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid #1f2937}
.btn{display:block;width:100%;padding:11px 14px;margin:5px 0;background:#1f2937;border:1px solid #374151;border-radius:8px;color:#e5e7eb;cursor:pointer;font-size:14px;text-align:left;transition:.2s}
.btn:hover{background:#374151;border-color:#60a5fa;transform:translateX(4px)}
.btn.active{background:#059669;border-color:#10b981;color:#fff;font-weight:700}
#view{flex:1;position:relative}
#canvas{width:100%;height:100%}
#hud{position:absolute;top:12px;left:12px;background:rgba(17,24,39,.92);padding:12px 18px;border-radius:10px;border:1px solid #374151;font-size:13px;pointer-events:none;line-height:1.8;z-index:10}
#hud span{color:#9ca3af}#hud b{color:#60a5fa}
#bar{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:16px;z-index:10}
#bar button{padding:14px 38px;border:none;border-radius:30px;font-size:16px;font-weight:700;cursor:pointer;transition:.25s;box-shadow:0 4px 20px rgba(0,0,0,.4)}
#bar button:hover{transform:scale(1.07)}
#btnPlan{background:linear-gradient(135deg,#2563eb,#3b82f6);color:#fff}
#btnMonta{background:linear-gradient(135deg,#059669,#10b981);color:#fff}
#load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:#60a5fa;font-size:20px;z-index:50;background:#0a0e17}
.spin{width:44px;height:44px;border:4px solid #1f2937;border-top-color:#60a5fa;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <h2>📐 Formas Geométricas</h2>
    <button class="btn active" onclick="setShape('cube',this)">🎲 Cubo</button>
    <button class="btn" onclick="setShape('tetra',this)">🔺 Tetraedro</button>
    <button class="btn" onclick="setShape('octa',this)">💎 Octaedro</button>
    <button class="btn" onclick="setShape('dodeca',this)">⬠ Dodecaedro</button>
    <button class="btn" onclick="setShape('icosa',this)">🔷 Icosaedro</button>
    <button class="btn" onclick="setShape('pyr4',this)">🔺 Pirâmide Quadrangular</button>
    <button class="btn" onclick="setShape('pyr3',this)">🔻 Pirâmide Triangular</button>
    <button class="btn" onclick="setShape('prism3',this)">📐 Prisma Triangular</button>
    <button class="btn" onclick="setShape('prism6',this)">⬡ Prisma Hexagonal</button>
    <button class="btn" onclick="setShape('paral',this)">📦 Paralelepípedo</button>
    <button class="btn" onclick="setShape('cyl',this)">🥫 Cilindro</button>
    <button class="btn" onclick="setShape('cone',this)">🔻 Cone</button>
  </div>
  <div id="view">
    <div id="load"><div class="spin"></div>Carregando 3D…</div>
    <div id="canvas"></div>
    <div id="hud">
      <div><span>Forma:</span> <b id="nome">Cubo</b></div>
      <div><span>Estado:</span> <b id="estado">Planificado</b></div>
      <div style="margin-top:4px;font-size:11px;color:#6b7280">🖱️ Arraste para girar · Scroll para zoom</div>
    </div>
    <div id="bar">
      <button id="btnPlan" onclick="toNet()">📄 Planificar</button>
      <button id="btnMonta" onclick="toSolid()">🧊 Montar</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>

<script>
/* ============== ENGINE ============== */
let scene, cam, renderer, ctrl, curShape='cube', isSolid=false, busy=false;
let netGroup=null, solidMesh=null;
const C=[0xe74c3c,0x3498db,0x2ecc71,0xf1c40f,0x9b59b6,0x1abc9c,0xe67e22,0x34495e,0x16a085,0xc0392b,0x2980b9,0x27ae60,0xd35400,0x8e44ad,0x2c3e50,0xf39c12];

function init(){
  const el=document.getElementById('canvas');
  scene=new THREE.Scene(); scene.background=new THREE.Color(0x0a0e17);
  cam=new THREE.PerspectiveCamera(45,el.clientWidth/el.clientHeight,.1,100);
  cam.position.set(0,4,16);
  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(el.clientWidth,el.clientHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  el.appendChild(renderer.domElement);
  ctrl=new THREE.OrbitControls(cam,renderer.domElement);
  ctrl.enableDamping=true; ctrl.dampingFactor=.05;
  scene.add(new THREE.AmbientLight(0xffffff,.55));
  const d=new THREE.DirectionalLight(0xffffff,.9); d.position.set(8,12,8); scene.add(d);
  scene.add(new THREE.DirectionalLight(0x60a5fa,.2).position.set(-4,-4,-4));
  const grid=new THREE.GridHelper(20,20,0x1f2937,0x111827); grid.position.y=-5; scene.add(grid);
  document.getElementById('load').style.display='none';
  setShape('cube',document.querySelector('.btn'));
  loop();
  addEventListener('resize',()=>{cam.aspect=el.clientWidth/el.clientHeight;cam.updateProjectionMatrix();renderer.setSize(el.clientWidth,el.clientHeight);});
}

function clearScene(){ if(netGroup){scene.remove(netGroup);netGroup.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material)o.material.dispose();});netGroup=null;} if(solidMesh){scene.remove(solidMesh);if(solidMesh.geometry)solidMesh.geometry.dispose();if(solidMesh.material)solidMesh.material.dispose();solidMesh=null;} }

function mat(col){return new THREE.MeshPhongMaterial({color:col,side:THREE.DoubleSide,transparent:true,opacity:.9,shininess:100,specular:0x333333});}

function edge(geo){const e=new THREE.EdgesGeometry(geo,20);return new THREE.LineSegments(e,new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:.7}));}

function makeFace(geo,col){const m=new THREE.Mesh(geo,mat(col));m.add(edge(geo));return m;}

/* ============== GEOMETRY HELPERS ============== */
function tri(v1,v2,v3,col){
  const geo=new THREE.BufferGeometry();
  const v=new Float32Array([...v1,...v2,...v3]);
  geo.setAttribute('position',new THREE.BufferAttribute(v,3));
  geo.computeVertexNormals();
  return makeFace(geo,col);
}
function quad(v1,v2,v3,v4,col){
  const geo=new THREE.BufferGeometry();
  const v=new Float32Array([...v1,...v2,...v3,...v1,...v3,...v4]);
  geo.setAttribute('position',new THREE.BufferAttribute(v,3));
  geo.computeVertexNormals();
  return makeFace(geo,col);
}
function poly(center,radius,segs,col){
  const geo=new THREE.CircleGeometry(radius,segs);
  const m=makeFace(geo,col); m.position.set(...center); return m;
}

/* ============== CUBO ============== */
function netCube(){
  const g=new THREE.Group(),a=1.3;
  const z=[0,0,0];
  // Cruz perfeita com vértices compartilhados
  // Face central (front)
  g.add(quad([-a,-a,0],[a,-a,0],[a,a,0],[-a,a,0],C[0]));
  // Top (encosta em cima da central)
  g.add(quad([-a,a,0],[a,a,0],[a,3*a,0],[-a,3*a,0],C[1]));
  // Bottom
  g.add(quad([-a,-3*a,0],[a,-3*a,0],[a,-a,0],[-a,-a,0],C[2]));
  // Left
  g.add(quad([-3*a,-a,0],[-a,-a,0],[-a,a,0],[-3*a,a,0],C[3]));
  // Right
  g.add(quad([a,-a,0],[3*a,-a,0],[3*a,a,0],[a,a,0],C[4]));
  // Back (encosta em cima do top)
  g.add(quad([-a,3*a,0],[a,3*a,0],[a,5*a,0],[-a,5*a,0],C[5]));
  return g;
}
function solidCube(){const m=new THREE.Mesh(new THREE.BoxGeometry(2.6,2.6,2.6),new THREE.MeshPhongMaterial({color:0x3498db,shininess:80}));m.add(edge(new THREE.BoxGeometry(2.6,2.6,2.6)));return m;}

/* ============== TETRAEDRO ============== */
function netTetra(){
  const g=new THREE.Group(),L=1.8,h=L*Math.sqrt(3)/2;
  const z=[0,0,0];
  // Vértices calculados para compartilhamento perfeito
  const V0=[0,2*h/3,0], V1=[-L/2,-h/3,0], V2=[L/2,-h/3,0];
  const V3=[0,-5*h/3,0]; // reflexão de V0 sobre V1-V2
  const V4=[-L*1.0,1.04,0]; // calculado para compartilhar V0-V1
  const V5=[L*1.0,1.04,0];  // compartilha V0-V2
  g.add(tri(V0,V1,V2,C[0])); // central
  g.add(tri(V1,V2,V3,C[1])); // baixo
  g.add(tri(V0,V1,V4,C[2])); // esq
  g.add(tri(V0,V2,V5,C[3])); // dir
  return g;
}
function solidTetra(){const m=new THREE.Mesh(new THREE.TetrahedronGeometry(1.8),new THREE.MeshPhongMaterial({color:0xe74c3c,shininess:80}));m.add(edge(new THREE.TetrahedronGeometry(1.8)));return m;}

/* ============== OCTAEDRO ============== */
function netOcta(){
  const g=new THREE.Group(),L=1.4,h=L*Math.sqrt(3)/2;
  const z=[0,0,0];
  // 8 triângulos em 2 fileiras de 4, todos conectados
  // Fileira superior (apontam cima)
  const V0=[-2*L,5*h/3,0], V1=[-1.5*L,2*h/3,0], V2=[-0.5*L,2*h/3,0], V3=[0,5*h/3,0];
  const V4=[0.5*L,2*h/3,0], V5=[L,5*h/3,0], V6=[1.5*L,2*h/3,0], V7=[2*L,5*h/3,0], V8=[2.5*L,2*h/3,0];
  g.add(tri(V0,V1,V2,C[0]));
  g.add(tri(V2,V3,V4,C[1]));
  g.add(tri(V4,V5,V6,C[2]));
  g.add(tri(V6,V7,V8,C[3]));
  // Fileira inferior (apontam baixo, compartilham bases superiores)
  const V9=[-L,-h/3,0], V10=[0,-h/3,0], V11=[L,-h/3,0], V12=[2*L,-h/3,0];
  g.add(tri(V1,V2,V9,C[4]));
  g.add(tri(V2,V4,V10,C[5]));
  g.add(tri(V4,V6,V11,C[6]));
  g.add(tri(V6,V8,V12,C[7]));
  return g;
}
function solidOcta(){const m=new THREE.Mesh(new THREE.OctahedronGeometry(1.6),new THREE.MeshPhongMaterial({color:0x9b59b6,shininess:80}));m.add(edge(new THREE.OctahedronGeometry(1.6)));return m;}

/* ============== DODECAEDRO ============== */
function netDodeca(){
  const g=new THREE.Group(),r=1.0;
  // Distância entre centros de pentágonos adjacentes (compartilham aresta)
  const d = 2 * r * Math.cos(Math.PI/5); // ≈ 1.618 (razão áurea)
  const dx = d * Math.sin(Math.PI/5); // ≈ 0.951
  const dy = d * Math.cos(Math.PI/5); // ≈ 1.618
  
  // Estrutura em cruz conforme a imagem (duas cruzes conectadas)
  // CRUZ SUPERIOR (6 pentágonos):
  g.add(poly([0,dy,0],r,5,C[0])); // central superior
  g.add(poly([0,2*dy,0],r,5,C[1])); // cima do central superior
  g.add(poly([dx,dy,0],r,5,C[2])); // direita do central superior
  g.add(poly([-dx,dy,0],r,5,C[3])); // esquerda do central superior
  g.add(poly([0,0,0],r,5,C[4])); // baixo do central superior (conecta)
  g.add(poly([0,3*dy,0],r,5,C[5])); // topo da cruz superior
  
  // CRUZ INFERIOR (6 pentágonos):
  g.add(poly([0,-dy,0],r,5,C[6])); // central inferior
  g.add(poly([dx,-dy,0],r,5,C[7])); // direita do central inferior
  g.add(poly([-dx,-dy,0],r,5,C[8])); // esquerda do central inferior
  g.add(poly([0,-2*dy,0],r,5,C[9])); // baixo do central inferior
  g.add(poly([dx,0,0],r,5,C[10])); // direita do conector (diagonal)
  g.add(poly([-dx,0,0],r,5,C[11])); // esquerda do conector (diagonal)
  
  return g;
}
function solidDodeca(){const m=new THREE.Mesh(new THREE.DodecahedronGeometry(1.6),new THREE.MeshPhongMaterial({color:0xf1c40f,shininess:80}));m.add(edge(new THREE.DodecahedronGeometry(1.6)));return m;}

/* ============== ICOSAEDRO ============== */
function netIcosa(){
  const g=new THREE.Group(),L=0.9,h=L*Math.sqrt(3)/2;
  // 20 triângulos em zig-zag: fileiras de 5,4,5,4,2
  let idx=0;
  const rows=[
    {n:5,y:2*h,up:true,xs:[-2,-1,0,1,2]},
    {n:4,y:h,up:false,xs:[-1.5,-0.5,0.5,1.5]},
    {n:5,y:0,up:true,xs:[-2,-1,0,1,2]},
    {n:4,y:-h,up:false,xs:[-1.5,-0.5,0.5,1.5]},
    {n:2,y:-2*h,up:true,xs:[-0.5,0.5]}
  ];
  // Preciso criar vértices compartilhados. Vou gerar posições de centros e usar CircleGeometry rotacionado.
  rows.forEach((row,ri)=>{
    for(let i=0;i<row.n;i++){
      const cx=row.xs[i]*L, cy=row.y;
      const m=poly([cx,cy,0],L,3,C[idx%C.length]);
      m.rotation.z=row.up?0:Math.PI;
      g.add(m); idx++;
    }
  });
  return g;
}
function solidIcosa(){const m=new THREE.Mesh(new THREE.IcosahedronGeometry(1.6),new THREE.MeshPhongMaterial({color:0x1abc9c,shininess:80}));m.add(edge(new THREE.IcosahedronGeometry(1.6)));return m;}

/* ============== PIRÂMIDE QUADRANGULAR ============== */
function netPyr4(){
  const g=new THREE.Group(),s=1.4,h=1.6;
  const z=[0,0,0];
  // Base quadrada
  g.add(quad([-s,-s,0],[s,-s,0],[s,s,0],[-s,s,0],C[0]));
  // 4 triângulos encostados nos lados
  g.add(tri([-s,s,0],[s,s,0],[0,s+h,0],C[1])); // norte
  g.add(tri([-s,-s,0],[s,-s,0],[0,-s-h,0],C[2])); // sul
  g.add(tri([s,-s,0],[s,s,0],[s+h,0,0],C[3])); // leste
  g.add(tri([-s,-s,0],[-s,s,0],[-s-h,0,0],C[4])); // oeste
  return g;
}
function solidPyr4(){const m=new THREE.Mesh(new THREE.ConeGeometry(1.4,2.4,4),new THREE.MeshPhongMaterial({color:0xe67e22,shininess:80}));m.add(edge(new THREE.ConeGeometry(1.4,2.4,4)));m.rotation.y=Math.PI/4;return m;}

/* ============== PIRÂMIDE TRIANGULAR ============== */
function netPyr3(){
  const g=new THREE.Group(),L=1.8,h=L*Math.sqrt(3)/2;
  const z=[0,0,0];
  const V0=[0,2*h/3,0], V1=[-L/2,-h/3,0], V2=[L/2,-h/3,0];
  const V3=[0,-5*h/3,0]; // reflexão de V0 sobre V1-V2
  const V4=[-L*1.0,1.04,0]; // reflexão de V2 sobre V0-V1
  const V5=[L*1.0,1.04,0];  // reflexão de V1 sobre V0-V2
  g.add(tri(V0,V1,V2,C[0])); // base
  g.add(tri(V1,V2,V3,C[1])); // frente
  g.add(tri(V0,V1,V4,C[2])); // esq
  g.add(tri(V0,V2,V5,C[3])); // dir
  return g;
}
function solidPyr3(){const m=new THREE.Mesh(new THREE.ConeGeometry(1.4,2.4,3),new THREE.MeshPhongMaterial({color:0xc0392b,shininess:80}));m.add(edge(new THREE.ConeGeometry(1.4,2.4,3)));m.rotation.y=Math.PI/6;return m;}

/* ============== PRISMA TRIANGULAR ============== */
function netPrism3(){
  const g=new THREE.Group(),w=1.2,H=1.6,h=w*Math.sqrt(3)/2;
  const z=[0,0,0];
  // 3 retângulos em fila
  g.add(quad([0,-H/2,0],[w,-H/2,0],[w,H/2,0],[0,H/2,0],C[0]));
  g.add(quad([w,-H/2,0],[2*w,-H/2,0],[2*w,H/2,0],[w,H/2,0],C[1]));
  g.add(quad([2*w,-H/2,0],[3*w,-H/2,0],[3*w,H/2,0],[2*w,H/2,0],C[2]));
  // 2 triângulos (topo e base) no retângulo do meio (R1, de w a 2w)
  g.add(tri([w,H/2,0],[2*w,H/2,0],[1.5*w,H/2+h,0],C[3]));
  g.add(tri([w,-H/2,0],[2*w,-H/2,0],[1.5*w,-H/2-h,0],C[4]));
  return g;
}
function solidPrism3(){const g=new THREE.Group();const m=new THREE.Mesh(new THREE.CylinderGeometry(1.2,1.2,2.4,3),new THREE.MeshPhongMaterial({color:0x2980b9,shininess:80}));m.add(edge(new THREE.CylinderGeometry(1.2,1.2,2.4,3)));g.add(m);return g;}

/* ============== PRISMA HEXAGONAL ============== */
function netPrism6(){
  const g=new THREE.Group(),side=1.0,H=1.6;
  const z=[0,0,0];
  // 6 retângulos em fila (largura = side = 1.0)
  for(let i=0;i<6;i++){
    const x0=(i-3)*side, x1=(i-2)*side;
    g.add(quad([x0,-H/2,0],[x1,-H/2,0],[x1,H/2,0],[x0,H/2,0],C[i]));
  }
  // 2 hexágonos no retângulo central (i=2,3? No meio: i=2 e i=3 são centrais)
  // Hexágonos em cima e embaixo do retângulo do meio (x de 0 a side, centrado em 0.5*side)
  const cx=-0.5*side; // centralizar em x=0
  g.add(poly([cx,H/2+side*0.866,0],side*0.9,6,C[6]));
  g.add(poly([cx,-H/2-side*0.866,0],side*0.9,6,C[7]));
  return g;
}
function solidPrism6(){const g=new THREE.Group();const m=new THREE.Mesh(new THREE.CylinderGeometry(1.5,1.5,2.4,6),new THREE.MeshPhongMaterial({color:0x27ae60,shininess:80}));m.add(edge(new THREE.CylinderGeometry(1.5,1.5,2.4,6)));g.add(m);return g;}

/* ============== PARALELEPÍPEDO ============== */
function netParal(){
  const g=new THREE.Group(),w=2.0,h=1.3,d=1.6;
  const z=[0,0,0];
  // Cruz com retângulos de proporções diferentes
  g.add(quad([-w,-h,0],[w,-h,0],[w,h,0],[-w,h,0],C[0])); // centro
  g.add(quad([-w,h,0],[w,h,0],[w,h+2*d,0],[-w,h+2*d,0],C[1])); // top
  g.add(quad([-w,-h-2*d,0],[w,-h-2*d,0],[w,-h,0],[-w,-h,0],C[2])); // bottom
  g.add(quad([-w-2*d,-h,0],[-w,-h,0],[-w,h,0],[-w-2*d,h,0],C[3])); // left
  g.add(quad([w,-h,0],[w+2*d,-h,0],[w+2*d,h,0],[w,h,0],C[4])); // right
  g.add(quad([-w,h+2*d,0],[w,h+2*d,0],[w,h+4*d,0],[-w,h+4*d,0],C[5])); // back
  return g;
}
function solidParal(){const m=new THREE.Mesh(new THREE.BoxGeometry(4,2.6,3.2),new THREE.MeshPhongMaterial({color:0x8e44ad,shininess:80}));m.add(edge(new THREE.BoxGeometry(4,2.6,3.2)));return m;}

/* ============== CILINDRO ============== */
function netCyl(){
  const g=new THREE.Group(),r=1.3,H=1.6;
  const z=[0,0,0];
  // Retângulo (lateral desenrolada)
  const W=Math.PI*r*2;
  g.add(quad([-W/2,-H,0],[W/2,-H,0],[W/2,H,0],[-W/2,H,0],C[0]));
  // 2 círculos encostados
  g.add(poly([0,H+r,0],r,32,C[1]));
  g.add(poly([0,-H-r,0],r,32,C[2]));
  return g;
}
function solidCyl(){const m=new THREE.Mesh(new THREE.CylinderGeometry(1.3,1.3,2.4,32),new THREE.MeshPhongMaterial({color:0xd35400,shininess:80}));m.add(edge(new THREE.CylinderGeometry(1.3,1.3,2.4,32)));return m;}

/* ============== CONE ============== */
function netCone(){
  const g=new THREE.Group(),r=1.4,H=2.4;
  const sl=Math.sqrt(r*r+H*H),ang=(r/sl)*Math.PI*2;
  // Setor circular
  const m=makeFace(new THREE.CircleGeometry(sl,32,0,ang),C[0]);
  m.rotation.z=-ang/2; // centralizar
  g.add(m);
  // Círculo base encostado
  g.add(poly([0,-sl*1.2,0],r,32,C[1]));
  return g;
}
function solidCone(){const m=new THREE.Mesh(new THREE.ConeGeometry(1.4,2.4,32),new THREE.MeshPhongMaterial({color:0xf39c12,shininess:80}));m.add(edge(new THREE.ConeGeometry(1.4,2.4,32)));return m;}

/* ============== REGISTRY ============== */
const nets={cube:netCube,tetra:netTetra,octa:netOcta,dodeca:netDodeca,icosa:netIcosa,pyr4:netPyr4,pyr3:netPyr3,prism3:netPrism3,prism6:netPrism6,paral:netParal,cyl:netCyl,cone:netCone};
const solids={cube:solidCube,tetra:solidTetra,octa:solidOcta,dodeca:solidDodeca,icosa:solidIcosa,pyr4:solidPyr4,pyr3:solidPyr3,prism3:solidPrism3,prism6:solidPrism6,paral:solidParal,cyl:solidCyl,cone:solidCone};
const nomes={cube:'Cubo',tetra:'Tetraedro',octa:'Octaedro',dodeca:'Dodecaedro',icosa:'Icosaedro',pyr4:'Pirâmide Quadrangular',pyr3:'Pirâmide Triangular',prism3:'Prisma Triangular',prism6:'Prisma Hexagonal',paral:'Paralelepípedo',cyl:'Cilindro',cone:'Cone'};

function setShape(name,btn){
  if(busy)return; curShape=name; isSolid=false; clearScene();
  document.querySelectorAll('.btn').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  document.getElementById('nome').textContent=nomes[name];
  document.getElementById('estado').textContent='Planificado';
  netGroup=nets[name](); scene.add(netGroup);
}

function toSolid(){
  if(isSolid||busy||!netGroup)return; isSolid=true; busy=true;
  const dur=500;
  netGroup.children.forEach((c,i)=>{new TWEEN.Tween(c.scale).to({x:0,y:0,z:0},dur).easing(TWEEN.Easing.Back.In).delay(i*30).start();});
  setTimeout(()=>{
    if(netGroup){scene.remove(netGroup);netGroup=null;}
    solidMesh=solids[curShape](); solidMesh.scale.set(0,0,0); scene.add(solidMesh);
    new TWEEN.Tween(solidMesh.scale).to({x:1,y:1,z:1},700).easing(TWEEN.Easing.Elastic.Out).onComplete(()=>{busy=false;document.getElementById('estado').textContent='Montado (3D)';}).start();
  },dur+200);
}

function toNet(){
  if(!isSolid||busy||!solidMesh)return; isSolid=false; busy=true;
  new TWEEN.Tween(solidMesh.scale).to({x:0,y:0,z:0},400).easing(TWEEN.Easing.Back.In).onComplete(()=>{
    if(solidMesh){scene.remove(solidMesh);solidMesh=null;}
    netGroup=nets[curShape]();
    netGroup.children.forEach(c=>c.scale.set(0,0,0));
    scene.add(netGroup);
    netGroup.children.forEach((c,i)=>{new TWEEN.Tween(c.scale).to({x:1,y:1,z:1},500).easing(TWEEN.Easing.Elastic.Out).delay(i*40).start();});
    setTimeout(()=>{busy=false;document.getElementById('estado').textContent='Planificado (2D)';},500+netGroup.children.length*40);
  }).start();
}

function loop(t){requestAnimationFrame(loop);TWEEN.update(t);ctrl.update();renderer.render(scene,cam);}
window.onload=init;
</script>
</body>
</html>
