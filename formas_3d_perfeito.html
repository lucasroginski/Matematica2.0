<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formas Geométricas — Planificação Perfeita & Cálculos 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#0a0e17;color:#fff;height:100vh;overflow:hidden}
#app{display:flex;height:100vh}
#sidebar{width:260px;background:#111827;border-right:1px solid #1f2937;padding:14px;overflow-y:auto}
#sidebar h2{color:#60a5fa;font-size:17px;text-align:center;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid #1f2937;display:flex;align-items:center;justify-content:center;gap:8px}
.btn{display:block;width:100%;padding:10px 12px;margin:4px 0;background:#1f2937;border:1px solid #374151;border-radius:8px;color:#e5e7eb;cursor:pointer;font-size:13px;text-align:left;transition:.2s;font-weight:500}
.btn:hover{background:#374151;border-color:#60a5fa;transform:translateX(4px)}
.btn.active{background:#059669;border-color:#10b981;color:#fff;font-weight:700;box-shadow:0 0 12px rgba(16,185,129,0.3)}
#view{flex:1;position:relative}
#canvas{width:100%;height:100%}
#hud{position:absolute;top:16px;left:16px;background:rgba(17,24,39,0.92);backdrop-filter:blur(8px);padding:12px 18px;border-radius:12px;border:1px solid #374151;font-size:13px;pointer-events:none;line-height:1.8;z-index:10;box-shadow:0 10px 25px rgba(0,0,0,0.5)}
#hud span{color:#9ca3af}#hud b{color:#60a5fa}

/* Painel de Medidas e Cálculos (Direita) */
#calc-panel{position:absolute;top:16px;right:16px;width:320px;max-height:calc(100vh - 32px);background:rgba(17,24,39,0.94);backdrop-filter:blur(12px);border:1px solid #374151;border-radius:14px;padding:16px;overflow-y:auto;z-index:10;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
#calc-panel h3{font-size:15px;color:#60a5fa;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #1f2937;display:flex;align-items:center;gap:8px}
.param-row{margin-bottom:10px}
.param-row label{display:flex;justify-content:space-between;font-size:12px;color:#d1d5db;margin-bottom:4px}
.param-controls{display:flex;align-items:center;gap:8px}
.param-controls input[type=range]{flex:1;accent-color:#3b82f6;cursor:pointer;height:6px}
.param-controls input[type=number]{width:60px;background:#1f2937;border:1px solid #374151;border-radius:6px;color:#60a5fa;font-weight:700;padding:3px 6px;text-align:center;font-size:12px}

.calc-card{background:#111827;border:1px solid #1f2937;border-radius:10px;padding:12px;margin-top:12px}
.calc-item{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:13px}
.calc-item:last-child{margin-bottom:0}
.calc-item .lbl{color:#9ca3af}
.calc-item .val{font-weight:700;color:#10b981;font-size:13px}
.calc-item .val.total{color:#60a5fa;font-size:15px}
.calc-item .val.vol{color:#f59e0b;font-size:15px}

.formula-box{margin-top:12px;background:rgba(31,41,55,0.5);border-left:3px solid #3b82f6;padding:10px;border-radius:4px;font-size:11px;color:#e5e7eb;line-height:1.6}
.formula-box h4{color:#60a5fa;font-size:11px;margin-bottom:4px;text-transform:uppercase;letter-spacing:0.5px}
.formula-line{margin-bottom:3px;font-family:monospace}

#bar{position:absolute;bottom:24px;left:calc(50% - 80px);transform:translateX(-50%);display:flex;gap:16px;z-index:10}
#bar button{padding:12px 32px;border:none;border-radius:30px;font-size:15px;font-weight:700;cursor:pointer;transition:.25s;box-shadow:0 6px 24px rgba(0,0,0,.5)}
#bar button:hover{transform:scale(1.06)}
#btnPlan{background:linear-gradient(135deg,#2563eb,#3b82f6);color:#fff}
#btnMonta{background:linear-gradient(135deg,#059669,#10b981);color:#fff}
#load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:#60a5fa;font-size:20px;z-index:50;background:#0a0e17}
.spin{width:44px;height:44px;border:4px solid #1f2937;border-top-color:#60a5fa;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <h2>📐 Formas Geométricas</h2>
    <button class="btn active" onclick="setShape('cube',this)">🎲 Cubo</button>
    <button class="btn" onclick="setShape('tetra',this)">🔺 Tetraedro</button>
    <button class="btn" onclick="setShape('octa',this)">💎 Octaedro</button>
    <button class="btn" onclick="setShape('dodeca',this)">⬠ Dodecaedro</button>
    <button class="btn" onclick="setShape('icosa',this)">🔷 Icosaedro</button>
    <button class="btn" onclick="setShape('pyr4',this)">🔺 Pirâmide Quadrangular</button>
    <button class="btn" onclick="setShape('pyr3',this)">🔻 Pirâmide Triangular</button>
    <button class="btn" onclick="setShape('prism3',this)">📐 Prisma Triangular</button>
    <button class="btn" onclick="setShape('prism6',this)">⬡ Prisma Hexagonal</button>
    <button class="btn" onclick="setShape('paral',this)">📦 Paralelepípedo</button>
    <button class="btn" onclick="setShape('cyl',this)">🥫 Cilindro</button>
    <button class="btn" onclick="setShape('cone',this)">🔻 Cone</button>
  </div>
  <div id="view">
    <div id="load"><div class="spin"></div>Carregando 3D…</div>
    <div id="canvas"></div>
    <div id="hud">
      <div><span>Forma:</span> <b id="nome">Cubo</b></div>
      <div><span>Estado:</span> <b id="estado">Planificado</b></div>
      <div style="margin-top:6px;font-size:11px;color:#6b7280">🖱️ Arraste para girar · Scroll para zoom</div>
    </div>
    
    <!-- Painel Lateral Direito: Medidas e Cálculos -->
    <div id="calc-panel">
      <h3>📐 Medidas & Cálculos</h3>
      <div id="param-container"></div>
      <div class="calc-card" id="results-card"></div>
      <div class="formula-box" id="formula-box"></div>
    </div>

    <div id="bar">
      <button id="btnPlan" onclick="toNet()">📄 Planificar</button>
      <button id="btnMonta" onclick="toSolid()">🧊 Montar</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>

<script>
/* ============== ENGINE ============== */
let scene, cam, renderer, ctrl, curShape='cube', isSolid=false, busy=false;
let netGroup=null, solidMesh=null;
const C=[0xe74c3c,0x3498db,0x2ecc71,0xf1c40f,0x9b59b6,0x1abc9c,0xe67e22,0x34495e,0x16a085,0xc0392b,0x2980b9,0x27ae60,0xd35400,0x8e44ad,0x2c3e50,0xf39c12,0xe84393,0x00cec9,0x6c5ce7,0xfdcb6e];

/* ============== DADOS E PARÂMETROS DE MEDIDAS ============== */
const defaultParams = {
  cube: { a: 5 },
  tetra: { a: 5 },
  octa: { a: 5 },
  dodeca: { a: 5 },
  icosa: { a: 5 },
  pyr4: { a: 6, h: 8 },
  pyr3: { a: 6, h: 8 },
  prism3: { a: 5, h: 8 },
  prism6: { a: 4, h: 8 },
  paral: { a: 6, b: 4, c: 5 },
  cyl: { r: 4, h: 8 },
  cone: { r: 4, h: 8 }
};

const baseParams = {
  cube: { a: 5 },
  tetra: { a: 5 },
  octa: { a: 5 },
  dodeca: { a: 5 },
  icosa: { a: 5 },
  pyr4: { a: 6, h: 8 },
  pyr3: { a: 6, h: 8 },
  prism3: { a: 5, h: 8 },
  prism6: { a: 4, h: 8 },
  paral: { a: 6, b: 4, c: 5 },
  cyl: { r: 4, h: 8 },
  cone: { r: 4, h: 8 }
};

let currentParams = JSON.parse(JSON.stringify(defaultParams));

function init(){
  const el=document.getElementById('canvas');
  scene=new THREE.Scene(); scene.background=new THREE.Color(0x0a0e17);
  cam=new THREE.PerspectiveCamera(45,el.clientWidth/el.clientHeight,.1,100);
  cam.position.set(0,4,16);
  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(el.clientWidth,el.clientHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  el.appendChild(renderer.domElement);
  ctrl=new THREE.OrbitControls(cam,renderer.domElement);
  ctrl.enableDamping=true; ctrl.dampingFactor=.05;
  scene.add(new THREE.AmbientLight(0xffffff,.6));
  const d=new THREE.DirectionalLight(0xffffff,.9); d.position.set(8,12,8); scene.add(d);
  scene.add(new THREE.DirectionalLight(0x60a5fa,.25).position.set(-4,-4,-4));
  const grid=new THREE.GridHelper(24,24,0x1f2937,0x111827); grid.position.y=-5; scene.add(grid);
  document.getElementById('load').style.display='none';
  setShape('cube',document.querySelector('.btn'));
  loop();
  addEventListener('resize',()=>{cam.aspect=el.clientWidth/el.clientHeight;cam.updateProjectionMatrix();renderer.setSize(el.clientWidth,el.clientHeight);});
}

function clearScene(){ if(netGroup){scene.remove(netGroup);netGroup.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material)o.material.dispose();});netGroup=null;} if(solidMesh){scene.remove(solidMesh);if(solidMesh.geometry)solidMesh.geometry.dispose();if(solidMesh.material)solidMesh.material.dispose();solidMesh=null;} }

function mat(col){return new THREE.MeshPhongMaterial({color:col,side:THREE.DoubleSide,transparent:true,opacity:.9,shininess:100,specular:0x333333});}

function edge(geo){const e=new THREE.EdgesGeometry(geo,20);return new THREE.LineSegments(e,new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:.75}));}

function makeFace(geo,col){const m=new THREE.Mesh(geo,mat(col));m.add(edge(geo));return m;}

/* ============== GEOMETRY HELPERS ============== */
function tri(v1,v2,v3,col){
  const geo=new THREE.BufferGeometry();
  const v=new Float32Array([...v1,...v2,...v3]);
  geo.setAttribute('position',new THREE.BufferAttribute(v,3));
  geo.computeVertexNormals();
  return makeFace(geo,col);
}

function quad(v1,v2,v3,v4,col){
  const geo=new THREE.BufferGeometry();
  const v=new Float32Array([...v1,...v2,...v3,...v1,...v3,...v4]);
  geo.setAttribute('position',new THREE.BufferAttribute(v,3));
  geo.computeVertexNormals();
  return makeFace(geo,col);
}

function poly(center,radius,segs,col){
  const geo=new THREE.CircleGeometry(radius,segs);
  const m=makeFace(geo,col); m.position.set(...center); return m;
}

function polyFromVertices(verts,col){
  const v=[];
  for(let i=1;i<verts.length-1;i++){
    v.push(verts[0][0],verts[0][1],0);
    v.push(verts[i][0],verts[i][1],0);
    v.push(verts[i+1][0],verts[i+1][1],0);
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(v),3));
  geo.computeVertexNormals();
  return makeFace(geo,col);
}

function makePentagonOnEdge(A,B){
  const dx=B[0]-A[0], dy=B[1]-A[1];
  const s=Math.hypot(dx,dy);
  const alpha=Math.atan2(dy,dx);
  const turn=2*Math.PI/5;
  const verts=[[A[0],A[1]],[B[0],B[1]]];
  let curX=B[0], curY=B[1], curAng=alpha;
  for(let i=0;i<3;i++){
    curAng+=turn;
    curX+=s*Math.cos(curAng);
    curY+=s*Math.sin(curAng);
    verts.push([curX,curY]);
  }
  return verts;
}

/* ============== CUBO ============== */
function netCube(){
  const g=new THREE.Group(),a=1.3;
  g.add(quad([-a,-a,0],[a,-a,0],[a,a,0],[-a,a,0],C[0]));
  g.add(quad([-a,a,0],[a,a,0],[a,3*a,0],[-a,3*a,0],C[1]));
  g.add(quad([-a,-3*a,0],[a,-3*a,0],[a,-a,0],[-a,-a,0],C[2]));
  g.add(quad([-3*a,-a,0],[-a,-a,0],[-a,a,0],[-3*a,a,0],C[3]));
  g.add(quad([a,-a,0],[3*a,-a,0],[3*a,a,0],[a,a,0],C[4]));
  g.add(quad([-a,3*a,0],[a,3*a,0],[a,5*a,0],[-a,5*a,0],C[5]));
  g.position.y=-a;
  return g;
}
function solidCube(){const m=new THREE.Mesh(new THREE.BoxGeometry(2.6,2.6,2.6),new THREE.MeshPhongMaterial({color:0x3498db,shininess:80}));m.add(edge(new THREE.BoxGeometry(2.6,2.6,2.6)));return m;}

/* ============== TETRAEDRO ============== */
function netTetra(){
  const g=new THREE.Group(),L=1.8,h=L*Math.sqrt(3)/2;
  const V0=[0,2*h/3,0], V1=[-L/2,-h/3,0], V2=[L/2,-h/3,0];
  const V3=[0,-5*h/3,0];
  const V4=[-L,h/3,0];
  const V5=[L,h/3,0];
  g.add(tri(V0,V1,V2,C[0]));
  g.add(tri(V1,V2,V3,C[1]));
  g.add(tri(V0,V1,V4,C[2]));
  g.add(tri(V0,V2,V5,C[3]));
  return g;
}
function solidTetra(){const m=new THREE.Mesh(new THREE.TetrahedronGeometry(1.8),new THREE.MeshPhongMaterial({color:0xe74c3c,shininess:80}));m.add(edge(new THREE.TetrahedronGeometry(1.8)));return m;}

/* ============== OCTAEDRO ============== */
function netOcta(){
  const g=new THREE.Group(),L=1.3,h=L*Math.sqrt(3)/2;
  const ox=-1.75*L, oy=-0.5*h;
  const T=(v1,v2,v3,col)=>g.add(tri([v1[0]+ox,v1[1]+oy,0],[v2[0]+ox,v2[1]+oy,0],[v3[0]+ox,v3[1]+oy,0],col));

  T([-L/2,h],[0,0],[L/2,h],C[0]);
  T([0,0],[L,0],[L/2,h],C[1]);
  T([L/2,h],[3*L/2,h],[L,0],C[2]);
  T([L,0],[2*L,0],[3*L/2,h],C[3]);
  T([3*L/2,h],[5*L/2,h],[2*L,0],C[4]);
  T([2*L,0],[3*L,0],[5*L/2,h],C[5]);
  T([5*L/2,h],[7*L/2,h],[3*L,0],C[6]);
  T([3*L,0],[7*L/2,h],[4*L,0],C[7]);
  return g;
}
function solidOcta(){const m=new THREE.Mesh(new THREE.OctahedronGeometry(1.6),new THREE.MeshPhongMaterial({color:0x9b59b6,shininess:80}));m.add(edge(new THREE.OctahedronGeometry(1.6)));return m;}

/* ============== DODECAEDRO ============== */
function netDodeca(){
  const g=new THREE.Group(), s=0.88;
  const R=s/(2*Math.sin(Math.PI/5));

  const P0_verts=[];
  const rot0=Math.PI/10;
  for(let i=0;i<5;i++){
    const ang=rot0+i*(2*Math.PI/5);
    P0_verts.push([R*Math.cos(ang),R*Math.sin(ang)]);
  }

  const allPentagons=[P0_verts];
  const P_leaves=[];

  for(let i=0;i<5;i++){
    const A=P0_verts[(i+1)%5];
    const B=P0_verts[i];
    const leaf=makePentagonOnEdge(A,B);
    allPentagons.push(leaf);
    P_leaves.push(leaf);
  }

  const leaf0=P_leaves[0];
  const Q1=makePentagonOnEdge(leaf0[3],leaf0[2]);
  allPentagons.push(Q1);

  const Q0=makePentagonOnEdge(Q1[3],Q1[2]);
  allPentagons.push(Q0);

  for(let i=1;i<5;i++){
    const A=Q0[(i+1)%5];
    const B=Q0[i];
    const leaf=makePentagonOnEdge(A,B);
    allPentagons.push(leaf);
  }

  let avgX=0, avgY=0, count=0;
  allPentagons.forEach(p=>{
    p.forEach(v=>{avgX+=v[0]; avgY+=v[1]; count++;});
  });
  avgX/=count; avgY/=count;

  allPentagons.forEach((p,idx)=>{
    const centeredVerts=p.map(v=>[v[0]-avgX, v[1]-avgY]);
    g.add(polyFromVertices(centeredVerts,C[idx%C.length]));
  });

  return g;
}
function solidDodeca(){const m=new THREE.Mesh(new THREE.DodecahedronGeometry(1.6),new THREE.MeshPhongMaterial({color:0xf1c40f,shininess:80}));m.add(edge(new THREE.DodecahedronGeometry(1.6)));return m;}

/* ============== ICOSAEDRO ============== */
function netIcosa(){
  const g=new THREE.Group(),L=0.9,h=L*Math.sqrt(3)/2;
  const ox=-2.25*L, oy=-0.5*h;
  const T=(v1,v2,v3,col)=>g.add(tri([v1[0]+ox,v1[1]+oy,0],[v2[0]+ox,v2[1]+oy,0],[v3[0]+ox,v3[1]+oy,0],col));

  let cIdx=0;
  for(let i=0;i<5;i++){
    const x0=i*L;
    T([x0,h],[x0+L,h],[x0+L/2,2*h],C[cIdx++%C.length]);
  }
  for(let i=0;i<5;i++){
    const x0=(i-0.5)*L;
    T([x0,0],[x0+L,0],[x0+L/2,h],C[cIdx++%C.length]);
  }
  for(let i=0;i<5;i++){
    const x0=i*L;
    T([x0,h],[x0+L,h],[x0+L/2,0],C[cIdx++%C.length]);
  }
  for(let i=0;i<5;i++){
    const x0=(i-0.5)*L;
    T([x0,0],[x0+L,0],[x0+L/2,-h],C[cIdx++%C.length]);
  }

  return g;
}
function solidIcosa(){const m=new THREE.Mesh(new THREE.IcosahedronGeometry(1.6),new THREE.MeshPhongMaterial({color:0x1abc9c,shininess:80}));m.add(edge(new THREE.IcosahedronGeometry(1.6)));return m;}

/* ============== PIRÂMIDE QUADRANGULAR ============== */
function netPyr4(){
  const g=new THREE.Group(),s=1.4,h=1.6;
  g.add(quad([-s,-s,0],[s,-s,0],[s,s,0],[-s,s,0],C[0]));
  g.add(tri([-s,s,0],[s,s,0],[0,s+h,0],C[1]));
  g.add(tri([-s,-s,0],[s,-s,0],[0,-s-h,0],C[2]));
  g.add(tri([s,-s,0],[s,s,0],[s+h,0,0],C[3]));
  g.add(tri([-s,-s,0],[-s,s,0],[-s-h,0,0],C[4]));
  return g;
}
function solidPyr4(){const m=new THREE.Mesh(new THREE.ConeGeometry(1.4,2.4,4),new THREE.MeshPhongMaterial({color:0xe67e22,shininess:80}));m.add(edge(new THREE.ConeGeometry(1.4,2.4,4)));m.rotation.y=Math.PI/4;return m;}

/* ============== PIRÂMIDE TRIANGULAR ============== */
function netPyr3(){
  const g=new THREE.Group(),L=1.8,h=L*Math.sqrt(3)/2;
  const V0=[0,2*h/3,0], V1=[-L/2,-h/3,0], V2=[L/2,-h/3,0];
  const V3=[0,-5*h/3,0];
  const V4=[-L,h/3,0];
  const V5=[L,h/3,0];
  g.add(tri(V0,V1,V2,C[0]));
  g.add(tri(V1,V2,V3,C[1]));
  g.add(tri(V0,V1,V4,C[2]));
  g.add(tri(V0,V2,V5,C[3]));
  return g;
}
function solidPyr3(){const m=new THREE.Mesh(new THREE.ConeGeometry(1.4,2.4,3),new THREE.MeshPhongMaterial({color:0xc0392b,shininess:80}));m.add(edge(new THREE.ConeGeometry(1.4,2.4,3)));m.rotation.y=Math.PI/6;return m;}

/* ============== PRISMA TRIANGULAR ============== */
function netPrism3(){
  const g=new THREE.Group(),w=1.2,H=1.6,h=w*Math.sqrt(3)/2;
  g.add(quad([0,-H/2,0],[w,-H/2,0],[w,H/2,0],[0,H/2,0],C[0]));
  g.add(quad([w,-H/2,0],[2*w,-H/2,0],[2*w,H/2,0],[w,H/2,0],C[1]));
  g.add(quad([2*w,-H/2,0],[3*w,-H/2,0],[3*w,H/2,0],[2*w,H/2,0],C[2]));
  g.add(tri([w,H/2,0],[2*w,H/2,0],[1.5*w,H/2+h,0],C[3]));
  g.add(tri([w,-H/2,0],[2*w,-H/2,0],[1.5*w,-H/2-h,0],C[4]));
  g.position.x=-1.5*w;
  return g;
}
function solidPrism3(){const g=new THREE.Group();const m=new THREE.Mesh(new THREE.CylinderGeometry(1.2,1.2,2.4,3),new THREE.MeshPhongMaterial({color:0x2980b9,shininess:80}));m.add(edge(new THREE.CylinderGeometry(1.2,1.2,2.4,3)));g.add(m);return g;}

/* ============== PRISMA HEXAGONAL ============== */
function netPrism6(){
  const g=new THREE.Group(),side=0.9,H=1.6,a=side*Math.sqrt(3)/2;
  for(let i=0;i<6;i++){
    const x0=(i-3)*side, x1=(i-2)*side;
    g.add(quad([x0,-H/2,0],[x1,-H/2,0],[x1,H/2,0],[x0,H/2,0],C[i]));
  }
  const cx=-0.5*side;
  g.add(poly([cx,H/2+a,0],side,6,C[6]));
  g.add(poly([cx,-H/2-a,0],side,6,C[7]));
  return g;
}
function solidPrism6(){const g=new THREE.Group();const m=new THREE.Mesh(new THREE.CylinderGeometry(1.5,1.5,2.4,6),new THREE.MeshPhongMaterial({color:0x27ae60,shininess:80}));m.add(edge(new THREE.CylinderGeometry(1.5,1.5,2.4,6)));g.add(m);return g;}

/* ============== PARALELEPÍPEDO ============== */
function netParal(){
  const g=new THREE.Group(),w=1.8,h=1.2,d=1.4;
  g.add(quad([-w,-h,0],[w,-h,0],[w,h,0],[-w,h,0],C[0]));
  g.add(quad([-w,h,0],[w,h,0],[w,h+2*d,0],[-w,h+2*d,0],C[1]));
  g.add(quad([-w,-h-2*d,0],[w,-h-2*d,0],[w,-h,0],[-w,-h,0],C[2]));
  g.add(quad([-w-2*d,-h,0],[-w,-h,0],[-w,h,0],[-w-2*d,h,0],C[3]));
  g.add(quad([w,-h,0],[w+2*d,-h,0],[w+2*d,h,0],[w,h,0],C[4]));
  g.add(quad([-w,h+2*d,0],[w,h+2*d,0],[w,h+4*d,0],[-w,h+4*d,0],C[5]));
  return g;
}
function solidParal(){const m=new THREE.Mesh(new THREE.BoxGeometry(3.6,2.4,2.8),new THREE.MeshPhongMaterial({color:0x8e44ad,shininess:80}));m.add(edge(new THREE.BoxGeometry(3.6,2.4,2.8)));return m;}

/* ============== CILINDRO ============== */
function netCyl(){
  const g=new THREE.Group(),r=1.2,H=1.6;
  const W=Math.PI*r*2;
  g.add(quad([-W/2,-H,0],[W/2,-H,0],[W/2,H,0],[-W/2,H,0],C[0]));
  g.add(poly([0,H+r,0],r,48,C[1]));
  g.add(poly([0,-H-r,0],r,48,C[2]));
  return g;
}
function solidCyl(){const m=new THREE.Mesh(new THREE.CylinderGeometry(1.2,1.2,2.4,48),new THREE.MeshPhongMaterial({color:0xd35400,shininess:80}));m.add(edge(new THREE.CylinderGeometry(1.2,1.2,2.4,48)));return m;}

/* ============== CONE ============== */
function netCone(){
  const g=new THREE.Group(),r=1.2,H=2.4;
  const R=Math.sqrt(r*r+H*H),theta=(r/R)*Math.PI*2;
  const startAngle=-Math.PI/2-theta/2;
  const geoSector=new THREE.CircleGeometry(R,48,startAngle,theta);
  const mSector=makeFace(geoSector,C[0]);
  mSector.position.set(0,0.8,0);
  g.add(mSector);

  const baseCenter=[0,0.8-R-r,0];
  g.add(poly(baseCenter,r,48,C[1]));
  return g;
}
function solidCone(){const m=new THREE.Mesh(new THREE.ConeGeometry(1.4,2.4,48),new THREE.MeshPhongMaterial({color:0xf39c12,shininess:80}));m.add(edge(new THREE.ConeGeometry(1.4,2.4,48)));return m;}

/* ============== REGISTRY ============== */
const nets={cube:netCube,tetra:netTetra,octa:netOcta,dodeca:netDodeca,icosa:netIcosa,pyr4:netPyr4,pyr3:netPyr3,prism3:netPrism3,prism6:netPrism6,paral:netParal,cyl:netCyl,cone:netCone};
const solids={cube:solidCube,tetra:solidTetra,octa:solidOcta,dodeca:solidDodeca,icosa:solidIcosa,pyr4:solidPyr4,pyr3:solidPyr3,prism3:solidPrism3,prism6:solidPrism6,paral:solidParal,cyl:solidCyl,cone:solidCone};
const nomes={cube:'Cubo',tetra:'Tetraedro',octa:'Octaedro',dodeca:'Dodecaedro',icosa:'Icosaedro',pyr4:'Pirâmide Quadrangular',pyr3:'Pirâmide Triangular',prism3:'Prisma Triangular',prism6:'Prisma Hexagonal',paral:'Paralelepípedo',cyl:'Cilindro',cone:'Cone'};

function setShape(name,btn){
  if(busy)return; curShape=name; isSolid=false; clearScene();
  document.querySelectorAll('.btn').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  document.getElementById('nome').textContent=nomes[name];
  document.getElementById('estado').textContent='Planificado';
  netGroup=nets[name](); scene.add(netGroup);
  
  renderControls();
  updateCalculations();
}

function updateMeshScale(){
  const p = currentParams[curShape];
  const bp = baseParams[curShape];
  let sx=1, sy=1, sz=1;
  
  if(['cube','tetra','octa','dodeca','icosa'].includes(curShape)){
    sx = sy = sz = p.a / bp.a;
  } else if(['pyr4','pyr3','prism3','prism6'].includes(curShape)){
    sx = sz = p.a / bp.a;
    sy = p.h / bp.h;
  } else if(curShape === 'paral'){
    sx = p.a / bp.a;
    sy = p.b / bp.b;
    sz = p.c / bp.c;
  } else if(['cyl','cone'].includes(curShape)){
    sx = sz = p.r / bp.r;
    sy = p.h / bp.h;
  }
  
  if(netGroup) netGroup.scale.set(sx, sy, sz);
  if(solidMesh) solidMesh.scale.set(sx, sy, sz);
}

/* ============== LÓGICA DE CONTROLES E CÁLCULOS ============== */
const paramLabels = {
  a: 'Aresta / Lado (a)',
  b: 'Altura (b)',
  c: 'Profundidade (c)',
  h: 'Altura (h)',
  r: 'Raio (r)'
};

function renderControls(){
  const container = document.getElementById('param-container');
  container.innerHTML = '';
  const p = currentParams[curShape];

  for(let key in p){
    const row = document.createElement('div');
    row.className = 'param-row';
    const labelText = paramLabels[key] || key;
    const minVal = 1, maxVal = 15;
    
    row.innerHTML = `
      <label>
        <span>${labelText}:</span>
        <b style="color:#60a5fa" id="val-lbl-${key}">${p[key]} m</b>
      </label>
      <div class="param-controls">
        <input type="range" min="${minVal}" max="${maxVal}" step="0.5" value="${p[key]}" oninput="onParamChange('${key}', this.value)">
        <input type="number" min="${minVal}" max="${maxVal}" step="0.5" value="${p[key]}" onchange="onParamChange('${key}', this.value)">
      </div>
    `;
    container.appendChild(row);
  }
}

function onParamChange(key, value){
  let val = parseFloat(value);
  if(isNaN(val) || val <= 0) val = 1;
  currentParams[curShape][key] = val;
  
  // Atualiza controles na tela
  const lbl = document.getElementById(`val-lbl-${key}`);
  if(lbl) lbl.textContent = `${val} m`;
  
  const container = document.getElementById('param-container');
  const inputs = container.querySelectorAll('input');
  inputs.forEach(inp => {
    if(inp.type === 'range' && inp.previousElementSibling && inp.parentElement.parentElement.querySelector('label').textContent.includes(paramLabels[key])){
      inp.value = val;
    }
  });
  
  updateMeshScale();
  updateCalculations();
}

function updateCalculations(){
  const p = currentParams[curShape];
  const card = document.getElementById('results-card');
  const formulaBox = document.getElementById('formula-box');
  
  let Ab = null, Al = null, At = 0, V = 0;
  let formulaHtml = '';
  
  switch(curShape){
    case 'cube': {
      const a = p.a;
      Ab = a * a;
      Al = 4 * a * a;
      At = 6 * a * a;
      V = Math.pow(a, 3);
      formulaHtml = `
        <h4>Fórmulas do Cubo</h4>
        <div class="formula-line"><b>Área Total (A):</b> 6 · a² = 6 · ${a}² = <b>${At.toFixed(2)} m²</b></div>
        <div class="formula-line"><b>Volume (V):</b> a³ = ${a}³ = <b>${V.toFixed(2)} m³</b></div>
      `;
      break;
    }
    case 'tetra': {
      const a = p.a;
      Ab = (Math.sqrt(3)/4) * a * a;
      Al = 3 * Ab;
      At = Math.sqrt(3) * a * a;
      V = Math.pow(a, 3) / (6 * Math.sqrt(2));
      formulaHtml = `
        <h4>Fórmulas do Tetraedro</h4>
        <div class="formula-line"><b>Área Total (A):</b> √3 · a² = √3 · ${a}² = <b>${At.toFixed(2)} m²</b></div>
        <div class="formula-line"><b>Volume (V):</b> a³ / (6√2) = ${a}³ / 8.485 = <b>${V.toFixed(2)} m³</b></div>
      `;
      break;
    }
    case 'octa': {
      const a = p.a;
      At = 2 * Math.sqrt(3) * a * a;
      V = (Math.sqrt(2) / 3) * Math.pow(a, 3);
      formulaHtml = `
        <h4>Fórmulas do Octaedro</h4>
        <div class="formula-line"><b>Área Total (A):</b> 2√3 · a² = 2√3 · ${a}² = <b>${At.toFixed(2)} m²</b></div>
        <div class="formula-line"><b>Volume (V):</b> (√2 / 3) · a³ = 0.471 · ${a}³ = <b>${V.toFixed(2)} m³</b></div>
      `;
      break;
    }
    case 'dodeca': {
      const a = p.a;
      At = 3 * Math.sqrt(25 + 10 * Math.sqrt(5)) * a * a;
      V = ((15 + 7 * Math.sqrt(5)) / 4) * Math.pow(a, 3);
      formulaHtml = `
        <h4>Fórmulas do Dodecaedro</h4>
        <div class="formula-line"><b>Área Total (A):</b> 3√(25+10√5) · a² = 20.646 · ${a}² = <b>${At.toFixed(2)} m²</b></div>
        <div class="formula-line"><b>Volume (V):</b> ((15+7√5)/4) · a³ = 7.663 · ${a}³ = <b>${V.toFixed(2)} m³</b></div>
      `;
      break;
    }
    case 'icosa': {
      const a = p.a;
      At = 5 * Math.sqrt(3) * a * a;
      V = (5 * (3 + Math.sqrt(5)) / 12) * Math.pow(a, 3);
      formulaHtml = `
        <h4>Fórmulas do Icosaedro</h4>
        <div class="formula-line"><b>Área Total (A):</b> 5√3 · a² = 8.660 · ${a}² = <b>${At.toFixed(2)} m²</b></div>
        <div class="formula-line"><b>Volume (V):</b> 5(3+√5)/12 · a³ = 2.182 · ${a}³ = <b>${V.toFixed(2)} m³</b></div>
      `;
      break;
    }
    case 'pyr4': {
      const a = p.a, h = p.h;
      Ab = a * a;
      const g = Math.sqrt(Math.pow(a/2, 2) + h * h);
      Al = 2 * a * g;
      At = Ab + Al;
      V = (1/3) * Ab * h;
      formulaHtml = `
        <h4>Fórmulas da Pirâmide Quadrada</h4>
        <div class="formula-line"><b>Área Base (Ab):</b> a² = ${a}² = ${Ab.toFixed(2)} m²</div>
        <div class="formula-line"><b>Apótema (g):</b> √((a/2)² + h²) = ${g.toFixed(2)} m</div>
        <div class="formula-line"><b>Área Total (A):</b> Ab + 2·a·g = <b>${At.toFixed(2)} m²</b></div>
        <div class="formula-line"><b>Volume (V):</b> (1/3)·Ab·h = (1/3)·${Ab.toFixed(1)}·${h} = <b>${V.toFixed(2)} m³</b></div>
      `;
      break;
    }
    case 'pyr3': {
      const a = p.a, h = p.h;
      Ab = (Math.sqrt(3)/4) * a * a;
      const ab = a / (2 * Math.sqrt(3));
      const g = Math.sqrt(ab * ab + h * h);
      Al = (3/2) * a * g;
      At = Ab + Al;
      V = (1/3) * Ab * h;
      formulaHtml = `
        <h4>Fórmulas da Pirâmide Triangular</h4>
        <div class="formula-line"><b>Área Base (Ab):</b> (√3/4)·a² = ${Ab.toFixed(2)} m²</div>
        <div class="formula-line"><b>Apótema (g):</b> √(ab² + h²) = ${g.toFixed(2)} m</div>
        <div class="formula-line"><b>Área Total (A):</b> Ab + (3/2)·a·g = <b>${At.toFixed(2)} m²</b></div>
        <div class="formula-line"><b>Volume (V):</b> (1/3)·Ab·h = <b>${V.toFixed(2)} m³</b></div>
      `;
      break;
    }
    case 'prism3': {
      const a = p.a, h = p.h;
      Ab = (Math.sqrt(3)/4) * a * a;
      Al = 3 * a * h;
      At = 2 * Ab + Al;
      V = Ab * h;
      formulaHtml = `
        <h4>Fórmulas do Prisma Triangular</h4>
        <div class="formula-line"><b>Área Base (Ab):</b> (√3/4)·a² = ${Ab.toFixed(2)} m²</div>
        <div class="formula-line"><b>Área Lateral (Al):</b> 3·a·h = 3·${a}·${h} = ${Al.toFixed(2)} m²</div>
        <div class="formula-line"><b>Área Total (A):</b> 2·Ab + Al = <b>${At.toFixed(2)} m²</b></div>
        <div class="formula-line"><b>Volume (V):</b> Ab·h = ${Ab.toFixed(1)}·${h} = <b>${V.toFixed(2)} m³</b></div>
      `;
      break;
    }
    case 'prism6': {
      const a = p.a, h = p.h;
      Ab = (3 * Math.sqrt(3) / 2) * a * a;
      Al = 6 * a * h;
      At = 2 * Ab + Al;
      V = Ab * h;
      formulaHtml = `
        <h4>Fórmulas do Prisma Hexagonal</h4>
        <div class="formula-line"><b>Área Base (Ab):</b> (3√3/2)·a² = ${Ab.toFixed(2)} m²</div>
        <div class="formula-line"><b>Área Lateral (Al):</b> 6·a·h = 6·${a}·${h} = ${Al.toFixed(2)} m²</div>
        <div class="formula-line"><b>Área Total (A):</b> 2·Ab + Al = <b>${At.toFixed(2)} m²</b></div>
        <div class="formula-line"><b>Volume (V):</b> Ab·h = <b>${V.toFixed(2)} m³</b></div>
      `;
      break;
    }
    case 'paral': {
      const a = p.a, b = p.b, c = p.c;
      Ab = a * c;
      Al = 2 * (a * b + b * c);
      At = 2 * (a * b + b * c + a * c);
      V = a * b * c;
      formulaHtml = `
        <h4>Fórmulas do Paralelepípedo</h4>
        <div class="formula-line"><b>Área Base (Ab):</b> a · c = ${a} · ${c} = ${Ab.toFixed(2)} m²</div>
        <div class="formula-line"><b>Área Total (A):</b> 2(ab + bc + ac) = <b>${At.toFixed(2)} m²</b></div>
        <div class="formula-line"><b>Volume (V):</b> a · b · c = ${a}·${b}·${c} = <b>${V.toFixed(2)} m³</b></div>
      `;
      break;
    }
    case 'cyl': {
      const r = p.r, h = p.h;
      Ab = Math.PI * r * r;
      Al = 2 * Math.PI * r * h;
      At = 2 * Ab + Al;
      V = Ab * h;
      formulaHtml = `
        <h4>Fórmulas do Cilindro</h4>
        <div class="formula-line"><b>Área Base (Ab):</b> π · r² = π · ${r}² = ${Ab.toFixed(2)} m²</div>
        <div class="formula-line"><b>Área Lateral (Al):</b> 2π · r · h = ${Al.toFixed(2)} m²</div>
        <div class="formula-line"><b>Área Total (A):</b> 2π·r(r + h) = <b>${At.toFixed(2)} m²</b></div>
        <div class="formula-line"><b>Volume (V):</b> π · r² · h = <b>${V.toFixed(2)} m³</b></div>
      `;
      break;
    }
    case 'cone': {
      const r = p.r, h = p.h;
      const g = Math.sqrt(r * r + h * h);
      Ab = Math.PI * r * r;
      Al = Math.PI * r * g;
      At = Ab + Al;
      V = (1/3) * Ab * h;
      formulaHtml = `
        <h4>Fórmulas do Cone</h4>
        <div class="formula-line"><b>Geratriz (g):</b> √(r² + h²) = ${g.toFixed(2)} m</div>
        <div class="formula-line"><b>Área Base (Ab):</b> π · r² = ${Ab.toFixed(2)} m²</div>
        <div class="formula-line"><b>Área Lateral (Al):</b> π · r · g = ${Al.toFixed(2)} m²</div>
        <div class="formula-line"><b>Área Total (A):</b> π·r(r + g) = <b>${At.toFixed(2)} m²</b></div>
        <div class="formula-line"><b>Volume (V):</b> (1/3)·π·r²·h = <b>${V.toFixed(2)} m³</b></div>
      `;
      break;
    }
  }
  
  let html = '';
  if(Ab !== null) html += `<div class="calc-item"><span class="lbl">Área da Base (Ab):</span><span class="val">${Ab.toFixed(2)} m²</span></div>`;
  if(Al !== null) html += `<div class="calc-item"><span class="lbl">Área Lateral (Al):</span><span class="val">${Al.toFixed(2)} m²</span></div>`;
  html += `<div class="calc-item"><span class="lbl">Área Total (At):</span><span class="val total">${At.toFixed(2)} m²</span></div>`;
  html += `<div class="calc-item"><span class="lbl">Volume (V):</span><span class="val vol">${V.toFixed(2)} m³</span></div>`;
  
  card.innerHTML = html;
  formulaBox.innerHTML = formulaHtml;
}

function toSolid(){
  if(isSolid||busy||!netGroup)return; isSolid=true; busy=true;
  const dur=450;
  netGroup.children.forEach((c,i)=>{new TWEEN.Tween(c.scale).to({x:0,y:0,z:0},dur).easing(TWEEN.Easing.Back.In).delay(i*25).start();});
  setTimeout(()=>{
    if(netGroup){scene.remove(netGroup);netGroup=null;}
    solidMesh=solids[curShape](); solidMesh.scale.set(0,0,0); scene.add(solidMesh);
    updateMeshScale();
    new TWEEN.Tween(solidMesh.scale).to({x:solidMesh.scale.x,y:solidMesh.scale.y,z:solidMesh.scale.z},650).easing(TWEEN.Easing.Elastic.Out).onComplete(()=>{busy=false;document.getElementById('estado').textContent='Montado (3D)';}).start();
  },dur+180);
}

function toNet(){
  if(!isSolid||busy||!solidMesh)return; isSolid=false; busy=true;
  new TWEEN.Tween(solidMesh.scale).to({x:0,y:0,z:0},350).easing(TWEEN.Easing.Back.In).onComplete(()=>{
    if(solidMesh){scene.remove(solidMesh);solidMesh=null;}
    netGroup=nets[curShape]();
    netGroup.children.forEach(c=>c.scale.set(0,0,0));
    scene.add(netGroup);
    updateMeshScale();
    const targetScale = {x: netGroup.scale.x, y: netGroup.scale.y, z: netGroup.scale.z};
    netGroup.children.forEach((c,i)=>{new TWEEN.Tween(c.scale).to({x:1,y:1,z:1},450).easing(TWEEN.Easing.Elastic.Out).delay(i*30).start();});
    setTimeout(()=>{busy=false;document.getElementById('estado').textContent='Planificado (2D)';},450+netGroup.children.length*30);
  }).start();
}

function loop(t){requestAnimationFrame(loop);TWEEN.update(t);ctrl.update();renderer.render(scene,cam);}
window.onload=init;
</script>
